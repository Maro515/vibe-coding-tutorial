<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バイブコーディング60日講座 — ゼロからWebアプリが作れるようになる</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#1f2937; --ink-soft:#5b6472; --line:#e5e8ef;
  --brand:#6366f1; --brand-deep:#4f46e5; --brand-soft:#eef0ff;
  --accent:#f59e0b; --ok:#10b981; --ok-soft:#e7f8f1; --ng:#ef4444; --ng-soft:#fdeaea;
  --code-bg:#1e1e2e; --code-ink:#e6e6f0;
  --radius:14px; --shadow:0 1px 3px rgba(20,24,40,.07),0 8px 24px rgba(20,24,40,.06);
  --w1:#0ea5e9; --w2:#f97316; --w3:#ec4899; --w4:#eab308; --w5:#8b5cf6; --w6:#14b8a6; --w7:#3b82f6; --w8:#6366f1; --w9:#10b981;
  --fig-box:#eef1f8; --fig-line:#94a0b8; --fig-text:#1f2937; --fig-muted:#5b6472;
}
body.dark{
  --bg:#12141c; --panel:#1b1e2a; --ink:#e7e9f0; --ink-soft:#9aa3b5; --line:#2a2e40;
  --brand:#818cf8; --brand-deep:#a5b0ff; --brand-soft:#252947;
  --ok-soft:#12352b; --ng-soft:#3a1d1d;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --fig-box:#272c40; --fig-line:#8b93a8; --fig-text:#e7e9f0; --fig-muted:#9aa3b5;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.9;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%}

/* ===== Layout ===== */
#app{display:flex;min-height:100vh}
#sidebar{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);height:100vh;overflow-y:auto;position:sticky;top:0;padding:16px 12px 40px;transition:transform .25s}
#main{flex:1;min-width:0}
.content{max-width:920px;margin:0 auto;padding:28px 24px 90px}
#menu-btn{display:none;position:fixed;bottom:18px;left:18px;z-index:60;width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;font-size:22px;box-shadow:var(--shadow)}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
@media(max-width:900px){
  #sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-105%);box-shadow:var(--shadow)}
  #sidebar.open{transform:translateX(0)}
  #overlay.show{display:block}
  #menu-btn{display:block}
  .content{padding:20px 16px 90px}
}

/* ===== Sidebar ===== */
.side-title{display:flex;align-items:center;gap:8px;padding:8px 10px 14px;font-weight:700;font-size:16px;cursor:pointer}
.side-title .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.side-progress{margin:0 10px 14px;font-size:13px;color:var(--ink-soft)}
.side-bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.side-bar>div{height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:99px;transition:width .4s}
.unit{margin-bottom:4px}
.unit-head{display:flex;align-items:center;gap:8px;width:100%;padding:10px 10px;border-radius:10px;font-size:15px;font-weight:700;text-align:left}
.unit-head:hover{background:var(--brand-soft)}
.unit-head .u-emoji{font-size:16px}
.unit-head .u-count{margin-left:auto;font-size:12px;color:var(--ink-soft);font-weight:500}
.unit-head .chev{font-size:10px;color:var(--ink-soft);transition:transform .2s}
.unit.open .chev{transform:rotate(90deg)}
.unit-days{display:none;padding:2px 0 6px}
.unit.open .unit-days{display:block}
.day-link{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px 7px 14px;border-radius:8px;font-size:14px;text-align:left;color:var(--ink-soft)}
.day-link:hover{background:var(--brand-soft);color:var(--ink)}
.day-link.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
.day-link .d-num{width:38px;flex-shrink:0;font-weight:700;font-size:12px;opacity:.75}
.day-link .d-check{margin-left:auto;font-size:13px}
.day-link .d-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Home ===== */
.hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#a855f7 100%);border-radius:20px;padding:38px 32px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:clamp(25px,3.6vw,34px);line-height:1.4;margin-bottom:8px}
.hero p{opacity:.92;font-size:16px;max-width:560px}
.hero .badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:99px;padding:4px 15px;font-size:13px;font-weight:700;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .s-label{font-size:13.5px;color:var(--ink-soft)}
.stat .s-value{font-size:30px;font-weight:800;color:var(--brand-deep)}
.stat .s-value small{font-size:14px;font-weight:600;color:var(--ink-soft)}
.continue-card{display:flex;align-items:center;gap:16px;background:var(--panel);border:2px solid var(--brand);border-radius:var(--radius);padding:18px 20px;margin-bottom:26px;box-shadow:var(--shadow);flex-wrap:wrap}
.continue-card .c-info{flex:1;min-width:200px}
.continue-card .c-eyebrow{font-size:12.5px;font-weight:700;color:var(--brand-deep);letter-spacing:.05em}
.continue-card .c-title{font-weight:800;font-size:19px}
.continue-card .c-sub{font-size:14px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;font-weight:700;font-size:15.5px;padding:12px 24px;border-radius:11px;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--brand-soft);color:var(--brand-deep)}
.btn.big{font-size:17px;padding:14px 30px}
h2.sec-h{font-size:21px;margin:30px 0 14px;display:flex;align-items:center;gap:8px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.unit-card{background:var(--panel);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;border-top:4px solid var(--uc,#6366f1);transition:transform .15s}
.unit-card:hover{transform:translateY(-3px)}
.unit-card .uc-week{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em}
.unit-card .uc-title{font-weight:800;font-size:17px;margin:2px 0 4px}
.unit-card .uc-desc{font-size:13.5px;color:var(--ink-soft);margin-bottom:10px;min-height:40px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{width:26px;height:26px;border-radius:7px;background:var(--line);color:var(--ink-soft);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip.done{background:var(--uc,#6366f1);color:#fff}
.about{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 20px;margin-top:26px}
.about details{border-bottom:1px solid var(--line);padding:13px 0}
.about details:last-child{border-bottom:none}
.about summary{font-weight:700;font-size:16px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
.about summary::before{content:"▸";color:var(--brand);transition:transform .2s}
.about details[open] summary::before{transform:rotate(90deg)}
.about .a-body{font-size:15.5px;color:var(--ink-soft);padding:10px 2px 2px}
.cert{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-radius:var(--radius);padding:26px;text-align:center;margin-bottom:22px}
.cert h3{font-size:20px;margin-bottom:6px}

/* ===== Day view ===== */
.crumb{font-size:14px;color:var(--ink-soft);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{color:var(--brand-deep);font-weight:700}
.crumb button:hover{text-decoration:underline}
.day-head{background:var(--panel);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow);margin-bottom:20px;border-left:6px solid var(--wc,#6366f1)}
.day-head .dh-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.day-head .dh-day{background:var(--wc,#6366f1);color:#fff;font-weight:800;font-size:13px;border-radius:99px;padding:3px 13px}
.day-head .dh-week{font-size:13.5px;color:var(--ink-soft);font-weight:600}
.day-head .dh-done{font-size:13.5px;color:var(--ok);font-weight:700}
.day-head h1{font-size:clamp(24px,3.4vw,31px);line-height:1.45}
.goals{background:var(--brand-soft);border-radius:12px;padding:14px 18px;margin-top:14px}
.goals .g-label{font-size:13.5px;font-weight:800;color:var(--brand-deep);margin-bottom:4px}
.goals ul{padding-left:22px;font-size:15.5px}
.lesson-sec{background:var(--panel);border-radius:var(--radius);padding:22px 26px;box-shadow:var(--shadow);margin-bottom:18px}
.lesson-sec>h2{font-size:21px;margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid var(--line);display:flex;gap:8px}
.lesson-sec>h2::before{content:"";width:5px;border-radius:3px;background:var(--wc,#6366f1);flex-shrink:0}
.sec-body{font-size:16.5px;line-height:2}
.sec-body p{margin-bottom:14px}
.sec-body ul,.sec-body ol{padding-left:22px;margin-bottom:10px}
.sec-body li{margin-bottom:3px}
.sec-body code{background:var(--brand-soft);color:var(--brand-deep);border-radius:5px;padding:1px 6px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.88em}
.sec-body table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px;display:block;overflow-x:auto}
.sec-body th,.sec-body td{border:1px solid var(--line);padding:10px 14px;text-align:left}
.sec-body th{background:var(--brand-soft);font-size:14px}
.callout{border-radius:11px;padding:14px 18px;margin:14px 0;font-size:15.5px;border-left:4px solid}
.callout.tip{background:var(--ok-soft);border-color:var(--ok)}
.callout.warn{background:var(--ng-soft);border-color:var(--ng)}
.callout.note{background:var(--brand-soft);border-color:var(--brand)}
.analogy{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(245,158,11,.04));border:1.5px dashed var(--accent);border-radius:11px;padding:15px 18px;margin:14px 0;font-size:15.5px}
body.dark .analogy{background:rgba(245,158,11,.08)}

/* ===== Code ===== */
.codeblock{border-radius:12px;overflow:hidden;margin:14px 0;box-shadow:var(--shadow)}
.codehead{display:flex;align-items:center;gap:10px;background:#2a2a3d;color:#cdd1e0;padding:8px 13px;font-size:13px}
.codehead .lang-badge{background:rgba(255,255,255,.14);border-radius:6px;padding:1px 9px;font-weight:800;font-size:10.5px;letter-spacing:.05em}
.codehead .codetitle{font-family:Menlo,Consolas,monospace;font-size:12.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codehead button{margin-left:auto;color:#cdd1e0;font-size:11.5px;padding:3px 10px;border-radius:6px;background:rgba(255,255,255,.1);flex-shrink:0}
.codehead button:hover{background:rgba(255,255,255,.2)}
.codehead button.try-btn{background:var(--ok);color:#fff;font-weight:700;margin-left:8px}
.codeblock pre{background:var(--code-bg);color:var(--code-ink);padding:16px 18px;overflow-x:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:14.5px;line-height:1.7;tab-size:2}
.tok-c{color:#7d8799;font-style:italic}
.tok-s{color:#a5d6a7}
.tok-k{color:#c792ea}
.tok-n{color:#f78c6c}
.tok-t{color:#82aaff}
.tok-a{color:#ffcb6b}
.playground{background:var(--panel);border:2px solid var(--ok);border-top:none;padding:12px}
.playground textarea{width:100%;min-height:180px;background:var(--code-bg);color:var(--code-ink);border:none;border-radius:9px;padding:13px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.6;resize:vertical;tab-size:2}
.playground textarea:focus{outline:2px solid var(--ok)}
.pg-actions{display:flex;gap:8px;margin:9px 0}
.pg-actions button{font-size:14px;font-weight:700;padding:7px 16px;border-radius:8px}
.pg-run{background:var(--ok);color:#fff}
.pg-reset{background:var(--line);color:var(--ink-soft)}
.pg-hint{font-size:12.5px;color:var(--ink-soft);margin-left:auto;align-self:center}
.playground iframe{width:100%;height:270px;border:1px solid var(--line);border-radius:9px;background:#fff}

/* ===== Exercise / Quiz ===== */
.exercise{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.exercise .ex-head{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;padding:14px 22px;font-weight:800;font-size:17px}
.exercise .ex-body{padding:20px 24px;font-size:16px}
.exercise details{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.exercise summary{font-weight:700;font-size:15px;cursor:pointer;color:var(--brand-deep)}
.quiz{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.quiz .qz-head{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;padding:14px 22px;font-weight:800;font-size:16.5px;display:flex;align-items:center}
.quiz .qz-head .qz-score{margin-left:auto;font-size:14px;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 13px}
.q-item{padding:16px 24px;border-bottom:1px solid var(--line)}
.q-item:last-child{border-bottom:none}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:10px}
.q-text .q-no{color:var(--brand);margin-right:6px}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;font-size:15.5px;background:var(--bg);transition:border-color .15s}
.choice:hover:not(:disabled){border-color:var(--brand)}
.choice:disabled{cursor:default;opacity:.75}
.choice.correct{border-color:var(--ok);background:var(--ok-soft);opacity:1;font-weight:700}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft);opacity:1}
.q-explain{display:none;margin-top:10px;background:var(--brand-soft);border-radius:10px;padding:13px 16px;font-size:15px}
.q-explain.show{display:block}
.q-explain .qe-tag{font-weight:800;font-size:13.5px}

/* ===== Takeaways / AI prompt / complete ===== */
.takeaways{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;margin-bottom:18px}
.takeaways h2{font-size:18px;margin-bottom:10px}
.takeaways ul{padding-left:4px;list-style:none}
.takeaways li{font-size:15.5px;padding:6px 0 6px 30px;position:relative}
.takeaways li::before{content:"✓";position:absolute;left:4px;color:var(--ok);font-weight:800}
.ai-box{background:linear-gradient(135deg,#0f172a,#1e293b);color:#e2e8f0;border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;position:relative}
body.dark .ai-box{background:linear-gradient(135deg,#0b1120,#172033);outline:1px solid var(--line)}
.ai-box h2{font-size:17px;margin-bottom:8px;color:#c4b5fd}
.ai-box .ai-prompt{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:14px 16px;font-size:15.5px;line-height:1.8}
.ai-box .ai-note{font-size:13px;opacity:.65;margin-top:8px}
.ai-box .ai-copy{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.12);color:#e2e8f0;font-size:12.5px;border-radius:7px;padding:4px 12px}
.ai-box .ai-copy:hover{background:rgba(255,255,255,.25)}
.complete-area{text-align:center;padding:14px 0 6px}
.btn-done{background:var(--ok);color:#fff;font-size:17.5px;font-weight:800;padding:15px 40px;border-radius:14px;box-shadow:var(--shadow);transition:transform .15s,filter .15s}
.btn-done:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn-done.is-done{background:var(--panel);color:var(--ok);outline:2px solid var(--ok)}
.day-nav{display:flex;gap:10px;margin-top:26px}
.day-nav button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 17px;text-align:left;box-shadow:var(--shadow);font-size:14.5px}
.day-nav button:hover{border-color:var(--brand)}
.day-nav .dn-label{font-size:12px;color:var(--ink-soft);display:block}
.day-nav .dn-title{font-weight:700}
.day-nav .next{text-align:right}
.cheer{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(120px);background:var(--ok);color:#fff;font-weight:800;padding:14px 28px;border-radius:99px;box-shadow:var(--shadow);transition:transform .35s;z-index:80;font-size:16px}
.cheer.show{transform:translateX(-50%) translateY(0)}
#theme-btn{position:fixed;top:16px;right:16px;z-index:30;width:40px;height:40px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);font-size:17px}

/* ===== 裏側大全 ===== */
.deep-card{background:linear-gradient(135deg,#083344,#0e7490);border-radius:var(--radius);padding:24px;color:#e0f2fe;margin:26px 0 4px;box-shadow:var(--shadow)}
.deep-card .dc-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.deep-card .dc-eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#67e8f9}
.deep-card .dc-title{font-size:20px;font-weight:800;margin:3px 0 6px}
.deep-card .dc-sub{font-size:14.5px;opacity:.85;max-width:560px}
.deep-card .dc-progress{margin-left:auto;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 18px;font-size:24px;font-weight:800;color:#67e8f9;white-space:nowrap}
.deep-card .dc-progress small{font-size:13px;font-weight:600;color:#e0f2fe}
.dc-chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.dc-ch{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;color:#e0f2fe;font-size:14px;font-weight:600;text-align:left;transition:background .15s}
.dc-ch:hover{background:rgba(255,255,255,.18)}
.dc-ch.read{background:rgba(103,232,249,.18);border-color:#67e8f9}
.dc-ch .dc-ch-e{font-size:15px}
.dc-ch .dc-ch-t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-ch .dc-ch-s{color:#67e8f9;font-weight:800}
.deep-link{display:block;width:100%;background:linear-gradient(135deg,rgba(6,182,212,.12),rgba(6,182,212,.05));border:1.5px solid #06b6d4;border-radius:var(--radius);padding:15px 20px;margin-bottom:18px;font-size:15.5px;text-align:left;color:var(--ink);transition:background .15s}
.deep-link:hover{background:rgba(6,182,212,.18)}
.deep-link strong{color:#0891b2}
body.dark .deep-link strong{color:#67e8f9}
.deep-unit{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}

/* ===== 図解 ===== */
.fig{margin:18px 0 14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 12px 6px;text-align:center}
.fig svg{width:100%;max-width:740px;height:auto;display:block;margin:0 auto}
.fig figcaption{font-size:14px;color:var(--ink-soft);padding:8px 10px 10px;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar"></nav>
  <div id="overlay"></div>
  <main id="main"><div class="content" id="content"></div></main>
</div>
<button id="menu-btn">☰</button>
<button id="theme-btn" title="ダーク/ライト切替">🌙</button>
<div class="cheer" id="cheer"></div>

<script>
const DAYS = [];
const DEEP = [];
const FIGS = {};
</script>
<script>
// ===== week1.js =====
// week1.js — バイブコーディング60日講座 第1週「Webとプログラミングの世界へ」(Day 1〜7)
// グローバルの DAYS 配列に push するだけのピュアJSファイル

// ===================================================================
// Day 1: コーディングとは？プログラミングとは？
// ===================================================================
DAYS.push({
  day: 1,
  week: 1,
  title: "コーディングってなに？",

        body: `async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(hash))
    .map(function (b) { return b.toString(16).padStart(2, "0"); })
    .join("");
}

// 1文字違うだけでハッシュは全く別物になる
sha256("password123").then(function (h) {
  console.log("password123 →", h);
});
sha256("password124").then(function (h) {
  console.log("password124 →", h);
});

const LANG_LABEL = {html:"HTML",css:"CSS",js:"JavaScript",python:"Python",text:"TEXT",bash:"ターミナル"};

/* ---------- 進捗ストア ---------- */
const STORE_KEY = "vibecoding60";
let store = {done:{}, quiz:{}, deepRead:{}, theme:null};
try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s && typeof s==="object") store = Object.assign(store,s); }catch(e){}
store.deepRead = store.deepRead || {};
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
function isDone(d){ return !!store.done[d]; }
function doneCount(){ return Object.keys(store.done).length; }

/* ---------- ユーティリティ ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(sel){ return document.querySelector(sel); }

/* ---------- シンタックスハイライト（簡易） ---------- */
function highlight(code, lang){
  let s = esc(code);
  if(lang==="js"){
    return s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(&quot;(?:[^&]|&(?!quot;))*?&quot;|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|if|else|for|while|break|continue|new|typeof|async|await|of|in|true|false|null|undefined|class|this|try|catch|throw)\b|\b(\d+(?:\.\d+)?)\b/g,
      (m,c,str,k,n)=> c?`<span class="tok-c">${c}</span>` : str?`<span class="tok-s">${str}</span>` : k?`<span class="tok-k">${k}</span>` : `<span class="tok-n">${n}</span>`);
  }
  if(lang==="python"){
    return s.replace(/(#[^\n]*)|(&quot;(?:[^&]|&(?!quot;))*?&quot;|'(?:[^'\\\n]|\\.)*')|\b(def|return|if|elif|else|for|in|while|break|continue|import|from|as|with|True|False|None|and|or|not|print|range|len|class|try|except|pass|lambda)\b|\b(\d+(?:\.\d+)?)\b/g,
      (m,c,str,k,n)=> c?`<span class="tok-c">${c}</span>` : str?`<span class="tok-s">${str}</span>` : k?`<span class="tok-k">${k}</span>` : `<span class="tok-n">${n}</span>`);
  }
  if(lang==="html"){
    return s.replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([a-zA-Z][\w-]*)((?:[^&]|&(?!gt;))*?)(\/?&gt;)/g,
      (m,c,open,tag,attrs,close)=>{
        if(c) return `<span class="tok-c">${c}</span>`;
        const a = attrs.replace(/([a-zA-Z-]+)(=)(&quot;.*?&quot;)/g,'<span class="tok-a">$1</span>$2<span class="tok-s">$3</span>');
        return `<span class="tok-t">${open}${tag}</span>${a}<span class="tok-t">${close}</span>`;
      });
  }
  if(lang==="css"){
    return s.replace(/(\/\*[\s\S]*?\*\/)|([a-zA-Z-]+)(\s*:)/g,
      (m,c,prop,colon)=> c?`<span class="tok-c">${c}</span>`:`<span class="tok-a">${prop}</span>${colon}`);
  }
  return s;
}

/* ---------- コードブロック描画 ---------- */
let PG_STORE = [];
function codeBlockHTML(codeObj, tryIt){
  const idx = PG_STORE.length;
  PG_STORE.push(codeObj);
  const lang = codeObj.lang||"text";
  const runnable = tryIt && (lang==="html"||lang==="js");
  return `<div class="codeblock" data-cb="${idx}">
    <div class="codehead">
      <span class="lang-badge">${LANG_LABEL[lang]||lang.toUpperCase()}</span>
      ${codeObj.title?`<span class="codetitle">${esc(codeObj.title)}</span>`:""}
      <button class="copy-btn" data-copy="${idx}">📋 コピー</button>
      ${runnable?`<button class="try-btn" data-try="${idx}">▶ 試してみる</button>`:""}
    </div>
    <pre><code>${highlight(codeObj.body, lang)}</code></pre>
    ${runnable?`<div class="playground" hidden>
      <textarea spellcheck="false"></textarea>
      <div class="pg-actions">
        <button class="pg-run" data-run="${idx}">▶ 実行</button>
        <button class="pg-reset" data-reset="${idx}">↺ リセット</button>
        <span class="pg-hint">コードを書き換えて実験してみましょう</span>
      </div>
      <iframe sandbox="allow-scripts allow-modals"></iframe>
    </div>`:""}
  </div>`;
}
function runInIframe(iframe, code, lang){
  if(lang==="js"){
    const payload = JSON.stringify(code).replace(/<\//g,"<\\/");
    code = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
      body{font:13px/1.7 "SF Mono",Menlo,Consolas,monospace;padding:12px;background:#1e1e2e;color:#e6e6f0;margin:0}
      .log{padding:3px 0;border-bottom:1px solid #2e2e44;white-space:pre-wrap}
      .err{color:#ff7b72}
      .empty{color:#7d8799;font-style:italic}
      </style></head><body><div id="__out"></div><scr`+`ipt>
      const out=document.getElementById("__out");
      function show(args,cls){const d=document.createElement("div");d.className="log "+(cls||"");
        d.textContent=args.map(a=>{ if(typeof a==="object"&&a!==null){try{return JSON.stringify(a)}catch(e){return String(a)}} return String(a);}).join(" ");
        out.appendChild(d);}
      console.log=(...a)=>show(a); console.warn=(...a)=>show(a,"err"); console.error=(...a)=>show(a,"err");
      window.onerror=(m)=>{show(["⚠️ エラー: "+m],"err");};
      try{ eval(${payload}); }catch(e){ show(["⚠️ エラー: "+e.message],"err"); }
      if(!out.children.length){const d=document.createElement("div");d.className="empty";d.textContent="(出力なし — console.log で表示できます)";out.appendChild(d);}
      </scr`+`ipt></body></html>`;
  }
  iframe.srcdoc = code;
}
function wireCodeBlocks(root){
  root.querySelectorAll(".copy-btn").forEach(btn=>{
    btn.onclick = ()=>{
      navigator.clipboard.writeText(PG_STORE[+btn.dataset.copy].body).then(()=>{
        btn.textContent="✅ コピーしました"; setTimeout(()=>btn.textContent="📋 コピー",1500);
      });
    };
  });
  root.querySelectorAll(".try-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const block = btn.closest(".codeblock");
      const pg = block.querySelector(".playground");
      const codeObj = PG_STORE[+btn.dataset.try];
      if(pg.hidden){
        pg.hidden=false;
        const ta = pg.querySelector("textarea");
        if(!ta.value) ta.value = codeObj.body;
        ta.style.minHeight = Math.min(340, 40 + codeObj.body.split("\n").length*20) + "px";
        runInIframe(pg.querySelector("iframe"), ta.value, codeObj.lang);
        btn.textContent="✕ 閉じる";
      }else{ pg.hidden=true; btn.textContent="▶ 試してみる"; }
    };
  });
  root.querySelectorAll(".pg-run").forEach(btn=>{
    btn.onclick = ()=>{
      const pg = btn.closest(".playground");
      const codeObj = PG_STORE[+btn.dataset.run];
      runInIframe(pg.querySelector("iframe"), pg.querySelector("textarea").value, codeObj.lang);
    };
  });
  root.querySelectorAll(".pg-reset").forEach(btn=>{
    btn.onclick = ()=>{
      const pg = btn.closest(".playground");
      const codeObj = PG_STORE[+btn.dataset.reset];
      pg.querySelector("textarea").value = codeObj.body;
      runInIframe(pg.querySelector("iframe"), codeObj.body, codeObj.lang);
    };
  });
}

function streak(){
  const dates = new Set(Object.values(store.done).map(t=>new Date(t).toDateString()));
  if(!dates.size) return 0;
  let n=0; const d=new Date();
  if(!dates.has(d.toDateString())) d.setDate(d.getDate()-1);
  while(dates.has(d.toDateString())){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function quizAvg(){
  const v = Object.values(store.quiz).filter(q=>q&&q.total);
  if(!v.length) return null;
  return Math.round(v.reduce((s,q)=>s+q.score/q.total,0)/v.length*100);
}

function wireQuiz(root, quizArr, key){
  const quiz = root.querySelector(".quiz");
  if(!quiz || !quizArr) return;
  const answered = {};
  quiz.querySelectorAll(".q-item").forEach(item=>{
    const qi = +item.dataset.q;
    const q = quizArr[qi];
    item.querySelectorAll(".choice").forEach(btn=>{
      btn.onclick = ()=>{
        if(answered[qi]!==undefined) return;
        const ci = +btn.dataset.c;
        answered[qi] = ci;
        item.querySelectorAll(".choice").forEach(b=>{
          b.disabled = true;
          if(+b.dataset.c===q.answer) b.classList.add("correct");
          else if(+b.dataset.c===ci) b.classList.add("wrong");
        });
        const exp = item.querySelector(".q-explain");
        exp.querySelector(".qe-tag").textContent = ci===q.answer ? "⭕ 正解！" : "❌ 不正解…";
        exp.classList.add("show");
        if(Object.keys(answered).length === quizArr.length){
          const score = quizArr.reduce((s,qq,i)=> s+(answered[i]===qq.answer?1:0), 0);
          store.quiz[key] = {score, total:quizArr.length};
          save();
          const sc = el("#qz-score");
          if(sc) sc.textContent = `結果 ${score}/${quizArr.length} 正解${score===quizArr.length?" 💯":""}`;
        }
      };
    });
  });
}

    <h1>${c.emoji} ${esc(c.title)}</h1>
    ${c.subtitle?`<p style="color:var(--ink-soft);font-size:14px;margin-top:4px">${esc(c.subtitle)}</p>`:""}
    <div class="goals"><div class="g-label">🎯 この章のゴール</div><ul>${(c.goals||[]).map(g=>`<li>${esc(g)}</li>`).join("")}</ul></div>
  </div>`;

  (c.sections||[]).forEach((sec,si)=>{
    html += `<div class="lesson-sec" style="--wc:${DEEP_COLOR}"><h2>${esc(sec.heading)}</h2><div class="sec-body">${sec.html||""}</div>`;
    html += figHTML("x"+c.ch+"-"+si);
    if(sec.code) html += codeBlockHTML(sec.code, sec.tryIt);
    html += `</div>`;
  });

  if(c.glossary && c.glossary.length){
    html += `<div class="lesson-sec" style="--wc:${DEEP_COLOR}"><h2>📖 この章の用語辞典</h2><div class="sec-body"><table>
      <tr><th style="white-space:nowrap">用語</th><th>意味</th></tr>
      ${c.glossary.map(g=>`<tr><td style="white-space:nowrap"><strong>${esc(g.term)}</strong></td><td>${esc(g.def)}</td></tr>`).join("")}
    </table></div></div>`;
  }

  if(c.quiz && c.quiz.length){
    html += `<div class="quiz"><div class="qz-head">🧠 理解度クイズ<span class="qz-score" id="qz-score">${qstate?`前回 ${qstate.score}/${qstate.total} 正解`:`全${c.quiz.length}問`}</span></div>`;
    c.quiz.forEach((q,qi)=>{
      html += `<div class="q-item" data-q="${qi}"><div class="q-text"><span class="q-no">Q${qi+1}.</span>${esc(q.q)}</div>
        <div class="choices">${q.choices.map((ch,ci)=>`<button class="choice" data-c="${ci}">${"ABCD"[ci]}. ${esc(ch)}</button>`).join("")}</div>
        <div class="q-explain"><span class="qe-tag"></span> ${esc(q.explain||"")}</div></div>`;
    });
    html += `</div>`;
  }

  if(c.takeaways && c.takeaways.length){
    html += `<div class="takeaways"><h2>📌 この章のまとめ</h2><ul>${c.takeaways.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  }
  if(c.aiPrompt){
    html += `<div class="ai-box"><button class="ai-copy" id="ai-copy">📋 コピー</button><h2>🤖 AIでさらに深掘り</h2>
      <div class="ai-prompt">${esc(c.aiPrompt)}</div>
      <div class="ai-note">↑ このプロンプトをChatGPTやClaudeに貼り付けて、この章の理解をさらに深めましょう。</div></div>`;
  }
  html += `<div class="complete-area"><button class="btn-done ${read?"is-done":""}" id="btn-done">${read?"✅ 読了済み（タップで取り消し）":"この章を読み終えた 🎉"}</button></div>
  <div class="day-nav">
    ${prev?`<button onclick="go('x${prev.ch}')"><span class="dn-label">← 前の章</span><span class="dn-title">第${prev.ch}章 ${esc(prev.title)}</span></button>`:"<span style='flex:1'></span>"}
    ${next?`<button class="next" onclick="go('x${next.ch}')"><span class="dn-label">次の章 →</span><span class="dn-title">第${next.ch}章 ${esc(next.title)}</span></button>`:"<span style='flex:1'></span>"}
  </div>`;

  const root = el("#content");
  root.innerHTML = html;
  wireCodeBlocks(root);
  wireQuiz(root, c.quiz, key);
  const aiBtn = el("#ai-copy");
  if(aiBtn) aiBtn.onclick = ()=>{
    navigator.clipboard.writeText(c.aiPrompt).then(()=>{ aiBtn.textContent="✅ コピーしました"; setTimeout(()=>aiBtn.textContent="📋 コピー",1500); });
  };
  el("#btn-done").onclick = ()=>{
    if(store.deepRead[c.ch]){ delete store.deepRead[c.ch]; }
    else{
      store.deepRead[c.ch] = Date.now();
      cheer(`🔬 第${c.ch}章 読了！ 裏側がまた一つ見えるようになりました`);
    }
    save(); renderDeep(c.ch); renderSidebar(null, c.ch);
    window.scrollTo({top:document.body.scrollHeight,behavior:"instant"});
  };
  window.scrollTo(0,0);
}

/* ---------- ナビゲーション ---------- */
function go(hash){
  location.hash = hash;
  el("#sidebar").classList.remove("open");
  el("#overlay").classList.remove("show");
}
function route(){
  const h = (location.hash||"#home").slice(1);
  const m = h.match(/^d(\d+)$/);
  const mx = h.match(/^x(\d+)$/);
  if(m){ const n=+m[1]; renderDay(n); renderSidebar(n); }
  else if(mx){ const n=+mx[1]; renderDeep(n); renderSidebar(null, n); }
  else { renderHome(); renderSidebar(null); }
}
window.addEventListener("hashchange", route);

function cheer(msg){
  const c = el("#cheer");
  c.textContent = msg;
  c.classList.add("show");
  setTimeout(()=>c.classList.remove("show"), 2600);
}

/* ---------- テーマ ---------- */
function applyTheme(){
  const dark = store.theme==="dark" || (store.theme===null && matchMedia("(prefers-color-scheme: dark)").matches);
  document.body.classList.toggle("dark", dark);
  el("#theme-btn").textContent = dark ? "☀️" : "🌙";
}
el("#theme-btn").onclick = ()=>{
  store.theme = document.body.classList.contains("dark") ? "light" : "dark";
  save(); applyTheme();
};

/* ---------- モバイルメニュー ---------- */
el("#menu-btn").onclick = ()=>{ el("#sidebar").classList.add("open"); el("#overlay").classList.add("show"); };
el("#overlay").onclick = ()=>{ el("#sidebar").classList.remove("open"); el("#overlay").classList.remove("show"); };

applyTheme();
route();
</script>
</body>
</html>
